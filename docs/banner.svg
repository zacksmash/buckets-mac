<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2c38"/>
      <stop offset="1" stop-color="#121219"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9440"/>
      <stop offset="1" stop-color="#f2545c"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ab0ff"/>
      <stop offset="1" stop-color="#4e6cf5"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b98cff"/>
      <stop offset="1" stop-color="#7a5af5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1280" height="440" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="440" rx="28" fill="url(#dots)"/>

  <g transform="translate(70 50)">
    <!-- browser window -->
    <g filter="url(#shadow)">
      <rect x="0" y="0" width="560" height="320" rx="18" fill="#eeeeee"/>
      <rect x="0" y="0" width="150" height="320" rx="18" fill="#e0e0e4"/>
      <rect x="132" y="0" width="18" height="320" fill="#e0e0e4"/>
      <circle cx="24" cy="22" r="6" fill="#ff5f57"/>
      <circle cx="44" cy="22" r="6" fill="#febc2e"/>
      <circle cx="64" cy="22" r="6" fill="#28c840"/>
      <!-- sidebar connections -->
      <rect x="18" y="56" width="22" height="22" rx="6" fill="url(#orange)"/>
      <rect x="50" y="62" width="70" height="10" rx="5" fill="#b8b8c0"/>
      <rect x="18" y="92" width="22" height="22" rx="6" fill="url(#blue)"/>
      <rect x="50" y="98" width="58" height="10" rx="5" fill="#b8b8c0"/>
      <rect x="18" y="128" width="22" height="22" rx="6" fill="url(#violet)"/>
      <rect x="50" y="134" width="64" height="10" rx="5" fill="#b8b8c0"/>
      <!-- path bar -->
      <rect x="172" y="16" width="200" height="14" rx="7" fill="#d2d2d2"/>
      <!-- file grid -->
      <g transform="translate(176 56)">
        <path d="M0 10 a8 8 0 0 1 8 -8 h24 l8 8 h36 a8 8 0 0 1 8 8 v40 a8 8 0 0 1 -8 8 h-68 a8 8 0 0 1 -8 -8 z" fill="url(#blue)"/>
        <rect x="12" y="84" width="60" height="9" rx="4.5" fill="#c4c4c8"/>
        <path transform="translate(118 0)" d="M0 10 a8 8 0 0 1 8 -8 h24 l8 8 h36 a8 8 0 0 1 8 8 v40 a8 8 0 0 1 -8 8 h-68 a8 8 0 0 1 -8 -8 z" fill="url(#blue)"/>
        <rect x="130" y="84" width="56" height="9" rx="4.5" fill="#c4c4c8"/>
        <g transform="translate(250 -6)">
          <rect x="10" y="0" width="62" height="78" rx="8" fill="#ffffff" stroke="#d0d0d4" stroke-width="2"/>
          <rect x="22" y="40" width="38" height="24" rx="5" fill="url(#violet)"/>
          <rect x="10" y="90" width="62" height="9" rx="4.5" fill="#c4c4c8"/>
        </g>
        <g transform="translate(0 124)">
          <rect x="10" y="0" width="62" height="78" rx="8" fill="#ffffff" stroke="#d0d0d4" stroke-width="2"/>
          <rect x="20" y="18" width="40" height="7" rx="3.5" fill="#d2d2d2"/>
          <rect x="20" y="32" width="30" height="7" rx="3.5" fill="#d2d2d2"/>
          <rect x="20" y="46" width="36" height="7" rx="3.5" fill="#d2d2d2"/>
          <rect x="10" y="90" width="62" height="9" rx="4.5" fill="#c4c4c8"/>
        </g>
        <g transform="translate(118 124)">
          <rect x="10" y="0" width="62" height="78" rx="8" fill="#ffffff" stroke="#d0d0d4" stroke-width="2"/>
          <rect x="22" y="40" width="38" height="24" rx="5" fill="url(#orange)"/>
          <rect x="10" y="90" width="62" height="9" rx="4.5" fill="#c4c4c8"/>
        </g>
      </g>
    </g>
    <!-- file being dropped in -->
    <g filter="url(#shadow)" transform="translate(496 170) rotate(8)">
      <rect x="0" y="0" width="70" height="88" rx="10" fill="url(#orange)"/>
      <path d="M35 64 v-36 M21 40 l14 -14 l14 14" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g stroke="#ff9440" stroke-width="4" stroke-linecap="round" opacity="0.7">
      <path d="M600 160 l14 -10"/><path d="M612 196 l22 -4"/><path d="M606 232 l14 6"/>
    </g>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
    <text x="780" y="190" font-size="92" font-weight="800" fill="#ffffff" letter-spacing="-2">Buckets</text>
    <text x="784" y="240" font-size="26" font-weight="500" fill="#c9cad6">Browse Cloudflare R2 and S3 buckets</text>
    <text x="784" y="274" font-size="26" font-weight="500" fill="#c9cad6">with the ease of the Finder.</text>
    <g transform="translate(784 312)" font-size="20" font-weight="600">
      <rect width="66" height="38" rx="9" fill="#ffffff" opacity="0.1"/>
      <text x="33" y="26" text-anchor="middle" fill="#ffffff">R2</text>
      <rect x="78" width="66" height="38" rx="9" fill="#ffffff" opacity="0.1"/>
      <text x="111" y="26" text-anchor="middle" fill="#ffffff">S3</text>
    </g>
  </g>
</svg>
